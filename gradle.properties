# Suppress the warning when building on non-macOS (Linux CI, Windows) where
# Kotlin/Native iOS targets are unavailable. macOS runners build them normally.
kotlin.native.ignoreDisabledTargets=true

# We manage the source-set hierarchy manually in shared/ to share JVM and Android actuals.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Suppress AGP warning about "targetSdk" in library modules
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings
